name: Infra Swarm Deploy

on:
  push:
    branches:
      - main
      - master
    paths:
      - stack.yml
      - developer.yml
      - .github/workflows/deploy.yml
  workflow_dispatch:

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ✅ FIX: aquí es donde estabas rompiendo el compose config
      - name: Validate stack syntax
        env:
          BACKEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/banco-nexus-backend:latest
          FRONTEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/banco-nexus-frontend:latest
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FRONTEND_API_URL: ${{ secrets.FRONTEND_API_URL }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          PORT: ${{ secrets.PORT }}
        run: docker compose -f stack.yml config > /tmp/stack.rendered.yml

      - name: Copy stack files to Swarm manager
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AWS_SSH_HOST }}
          username: ${{ secrets.AWS_SSH_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          source: "stack.yml,developer.yml"
          target: "/home/${{ secrets.AWS_SSH_USER }}/banco-nexus-infra/"

      - name: Deploy stack in Docker Swarm
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_SSH_HOST }}
          username: ${{ secrets.AWS_SSH_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            set -e

            mkdir -p /home/${{ secrets.AWS_SSH_USER }}/banco-nexus-infra/
            cd /home/${{ secrets.AWS_SSH_USER }}/banco-nexus-infra/

            export STACK_NAME="${{ vars.STACK_NAME }}"
            export BACKEND_IMAGE="${{ secrets.DOCKER_USERNAME }}/banco-nexus-backend:latest"
            export FRONTEND_IMAGE="${{ secrets.DOCKER_USERNAME }}/banco-nexus-frontend:latest"
            export FRONTEND_API_URL="${{ secrets.FRONTEND_API_URL }}"
            export JWT_SECRET="${{ secrets.JWT_SECRET }}"
            export MONGO_URI="${{ secrets.MONGO_URI }}"
            export PORT="${{ secrets.PORT }}"

            docker stack deploy \
              --compose-file stack.yml \
              "$STACK_NAME" \
              --with-registry-auth

            docker stack services "$STACK_NAME"