stackName: banco_nexus

images:
	backend: dockerhub-user/banco-nexus-backend:latest
	frontend: dockerhub-user/banco-nexus-frontend:latest

runtime:
	frontendApiUrl: http://localhost:3000/api

requiredGithubSecrets:
	- DOCKER_USERNAME
	- DOCKER_PASSWORD
	- AWS_SSH_HOST
	- AWS_SSH_USER
	- AWS_SSH_KEY
	- FRONTEND_API_URL
	- JWT_SECRET

requiredGithubVariables:
	- STACK_NAME
