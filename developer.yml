stackName: banco_nexus

images:
  backend: roberto1117/banco-nexus-backend:latest

runtime:
  backendPort: 3000

database:
  provider: mongodb-atlas

requiredGithubSecrets:
  - DOCKER_USERNAME
  - DOCKER_PASSWORD
  - AWS_SSH_HOST
  - AWS_SSH_USER
  - AWS_SSH_KEY
  - JWT_SECRET
  - MONGO_URI

requiredGithubVariables:
  - STACK_NAME